name: Attach Windows EXE to release draft

on:
  workflow_dispatch:

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36318864225 --repo blueway01/MUSIC-CUTTER --name MUSIC-CUTTER-Windows --dir release-files

      - name: Attach release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 "release-files/MUSIC CUTTER.exe" "release-files/MUSIC CUTTER SHA256.txt" --repo blueway01/MUSIC-CUTTER --clobber
